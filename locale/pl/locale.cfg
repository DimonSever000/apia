[space-location-description]
apia=Jedna z planet układu podwójnego o gęstej i lepkiej atmosferze. Powierzchnia składa się z licznych małych wysp dryfujących w oceanach odżywczego mleczka pszczelego wytwarzanego przez lokalne pszczoły. Faunę stanowi symbioza owadów produkujących miód oraz larw bezkręgowców.
carnova=Najmasywniejsza planeta układu podwójnego o atmosferze bogatej w tlen. Planeta pokryta jest oceanem cieczy o składzie przypominającym krew. Powierzchnię usiane są liczne wyspy z tkanki mięsnej, z których wyłaniają się złoża minerałów kostnych. Faunę stanowią drapieżne ryby zamieszkujące morza.
apia-carnova-orbit=Centrum obrotu układu podwójnego.


