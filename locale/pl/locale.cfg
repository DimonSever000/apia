apia-briefing=Apia Odprawa
carnova-briefing=Carnova Odprawa

[tips-and-tricks-item-description]
apia-briefing=[planet=apia] to jedna z planet układu podwójnego [planet=apia]-[planet=carnova], charakteryzująca się gęstą atmosferą, w której [entity=logistic-robot] i [entity=construction-robot] wiążą się z wyższymi kosztami. Ze względu na gęste chmury [entity=solar-panel] jest mniej wydajny.\nCała powierzchnia pokryta jest morzami [fluid=royal-jelly], zamieszkanymi przez [entity=larvae]. Zastygłe szczątki tych stworzeń mogą stać się źródłem podstawowych surowców: [item=iron-ore], [item=copper-ore] i [item=stone].\nInnymi mieszkańcami planety są owady produkujące miód, które budują [entity=wild-hive]. Wytwarzane przez nie [item=honeycombs] można przetworzyć na [item=honey] i [item=wax].\nNowym ważnym surowcem planety jest [item=phosphorus] oraz [fluid=phosphoric-acid].
carnova-briefing=[planet=carnova] jest jedną z planet układu podwójnego [planet=apia]-[planet=carnova]. Powierzchnię pokrywają oceany [fluid=blood], w których często znajdują się tarliska lokalnej fauny — [entity=piranha].\nGłównym źródłem podstawowych surowców są [item=bones], zawierające minerały i wapń. Z nich można uzyskać podstawowe surowce: [item=iron-ore], [item=copper-ore], [item=stone], [item=phosphorus], oraz [item=calcite].\nPowierzchnia składa się z licznych wysp [item=flesh], które można przetworzyć w celu uzyskania [item=proteins] i [item=lipids]. Alternatywnym przemysłowym źródłem kwasu będzie [fluid=phosphoric-acid].
