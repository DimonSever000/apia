[technology-description]
planet-discovery-apia-carnova=Podwójny układ planet z zewnętrznym środkiem ciężkości krążącym wokół gwiazdy. Bardzo rzadkie zjawisko w kosmosie. Obie planety tętnią życiem, a każda z nich rządzi się własnymi, specyficznymi prawami.
parasites=Naucz się odtwarzać cykl życiowy larw, aby pozyskiwać zasoby.
phosphorus=Wykorzystanie fosforu w procesach chemicznych.
phosphate-battery=Zastosowanie kwasu fosforowego w produkcji baterii.
apiculture=Dzikie ule na planecie mogą stać się źródłem miodu i wosku.
honey-processing=Miód może stać się źródłem wody i energii dla fabryki.
wax-processing=Pojemność cieplna wosku i jego właściwości chemiczne sprawiają, że jest on niezwykle przydatny w warunkach panujących na planecie.
artificial-hive=Zautomatyzuj produkcję plastrów miodu, aby zwiększyć skalę fabryki.
apicultural-science-pack=Kolejny krok w kierunku wielkości.
bio-solar-panel=Wprowadź technologię fotosyntezy do produkcji energii.
bioreactor=Chemiczna synteza energii bezpośrednio ze składników odżywczych.
phosphorus-shell=To nie jest zbrodnia wojenna, jeśli gryzą.
bones-processing=Kości są bardzo bogatym źródłem kalcytu, minerałów i kamienia.
refreshment=Jeśli masz już dość widoku gnijących szczątków wszędzie dookoła, to może być rozwiązanie.


